<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <title>Simulador Coletor Zebra - Treinamento Picking</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    :root {
      --bg-body: #000000;
      --frame-bg: #111111;
      --screen-bg: #000000;
      --border: #303030;
      --green: #00ff00;
      --green-soft: #7cff7c;
      --danger: #ff4d4d;
      --font-mono: "Consolas", "Courier New", monospace;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: var(--bg-body);
      color: var(--green);
      font-family: var(--font-mono);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 10px;
    }

    .device {
      width: 320px;
      max-width: 100%;
      background: var(--frame-bg);
      border-radius: 18px;
      padding: 8px;
      border: 2px solid var(--border);
      box-shadow: 0 12px 26px rgba(0, 0, 0, 0.9);
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    .status-bar {
      height: 16px;
      background: #2b2b2b;
      border-radius: 10px 10px 0 0;
      padding: 0 6px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      color: #f5f5f5;
      font-size: 8px;
    }

    .status-left {
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .status-dot {
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: #00ff00;
    }

    .status-right {
      display: flex;
      gap: 5px;
      align-items: center;
      font-size: 7px;
    }

    .screen {
      background: var(--screen-bg);
      border-radius: 0 0 10px 10px;
      border: 1px solid #202020;
      padding: 6px 5px;
      display: flex;
      flex-direction: column;
      gap: 2px;
      min-height: 160px;
      text-shadow: 0 0 2px rgba(0, 255, 0, 0.4);
    }

    .line {
      font-size: 11px;
      color: var(--green);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .label {
      color: var(--green-soft);
    }

    .value {
      color: var(--green);
      font-weight: 600;
    }

    .img-box {
      width: 100%;
      height: 45px;
      display: flex;
      justify-content: center;
      align-items: center;
      margin: 2px 0;
      background: #000;
      border: 1px solid #222;
      border-radius: 3px;
      overflow: hidden;
    }

    .img-box img {
      max-height: 28px;
      max-width: 60%;
      width: auto;
      height: auto;
      object-fit: contain;
      border-radius: 2px;
      display: block;
    }

    .status-msg {
      margin-top: 2px;
      font-size: 10px;
      min-height: 12px;
      font-weight: bold;
    }

    .status-ok {
      color: var(--green-soft);
    }

    .status-err {
      color: var(--danger);
    }

    .blink {
      animation: blink 0.8s step-start infinite;
    }

    @keyframes blink {
      50% { opacity: 0; }
    }

    .nav-hints {
      margin-top: 4px;
      font-size: 9px;
      color: var(--green);
    }

    .keyboard-area {
      margin-top: 2px;
      padding: 5px;
      background: #050505;
      border-radius: 8px;
      border: 1px solid #252525;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .kb-label {
      font-size: 8px;
      color: var(--green-soft);
      display: flex;
      justify-content: space-between;
    }

    .scan-input {
      width: 100%;
      padding: 4px 5px;
      font-family: var(--font-mono);
      font-size: 10px;
      color: var(--green);
      background: #000;
      border: 1px solid #333;
      border-radius: 3px;
      outline: none;
    }

    .scan-input:focus {
      border-color: var(--green);
    }

    .scan-input::placeholder {
      color: #333;
    }

    .btn-row {
      display: flex;
      gap: 4px;
      margin-top: 2px;
    }

    .btn {
      flex: 1;
      padding: 4px 2px;
      border-radius: 4px;
      border: 1px solid #333;
      background: #000;
      color: var(--green);
      font-family: var(--font-mono);
      font-size: 8px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.1s;
    }

    .btn:hover {
      background: #111;
      border-color: var(--green);
    }

    .btn:active {
      background: #000;
    }

    .hint {
      margin-top: 2px;
      font-size: 7px;
      color: #555;
      text-align: right;
    }
  </style>
</head>
<body>

  <div class="device">
    <!-- Barra superior do coletor -->
    <div class="status-bar">
      <div class="status-left">
        <div class="status-dot"></div>
        <span id="clock">12:00</span>
      </div>
      <div class="status-right">
        <span>WiFi</span>
        <span>BT</span>
        <span>Bat</span>
      </div>
    </div>

    <!-- Tela do Coletor -->
    <div class="screen">
      <div class="line" id="code-line">--.--.---.--.----</div>
      <div class="line" id="desc-line">CARREGANDO...</div>

      <div class="img-box">
        <img id="product-img" src="" alt="Produto" />
      </div>

      <div class="line">
        <span class="label">Solicitado:</span>
        <span class="value" id="requested">0</span>
      </div>
      <div class="line">
        <span class="label">Separado:</span>
        <span class="value" id="picked">0</span>
      </div>
      <div class="line">
        <span class="label">Conf. Prod:</span>
        <span class="value blink" id="confirm-status">AGUARDANDO LEITURA</span>
      </div>

      <div class="status-msg" id="status-msg"></div>

      <div class="nav-hints">
        [&lt;]Ant.   [&gt;]Prox.   [F1]Retornar
      </div>
    </div>

    <!-- Leitor / Botões -->
    <div class="keyboard-area">
      <div class="kb-label">
        <span>LEITOR CÓDIGO BARRAS</span>
        <span>ENTER p/ confirmar</span>
      </div>
      <input type="text" id="barcode-input" class="scan-input" placeholder="Bipe ou digite o código..." autofocus />
      
      <div class="btn-row">
        <button type="button" class="btn" id="btn-prev">&lt; Anterior</button>
        <button type="button" class="btn" id="btn-next">Próximo &gt;</button>
      </div>

      <div class="hint" id="correct-hint">
        Código: 789000000001
      </div>
    </div>
  </div>

  <script>
    const pedido = {
      itens: [
        {
          codigo: "02.20N.035.01.0000",
          descricao: "BARRA CEREAIS KOBBER",
          solicitado: 4,
          barcode: "789000000001",
          imagem: "https://images.unsplash.com/photo-1622484212850-eb596d769edc?auto=format&fit=crop&w=300&q=80"
        },
        {
          codigo: "01.10A.012.02.1234",
          descricao: "BISCOITO RECHEADO CHOCOLATE",
          solicitado: 5,
          barcode: "789000000002",
          imagem: "https://images.unsplash.com/photo-1558961363-fa8fdf82db35?auto=format&fit=crop&w=300&q=80"
        },
        {
          codigo: "03.15B.020.05.9876",
          descricao: "ÁGUA MINERAL 500ML",
          solicitado: 2,
          barcode: "789000000003",
          imagem: "https://images.unsplash.com/photo-1523362628745-0c100150b504?auto=format&fit=crop&w=300&q=80"
        }
      ]
    };

    let indice = 0;
    let separadoAtual = 0;

    const codeline = document.getElementById("code-line");
    const descline = document.getElementById("desc-line");
    const requested = document.getElementById("requested");
    const picked = document.getElementById("picked");
    const confirmStatus = document.getElementById("confirm-status");
    const statusMsg = document.getElementById("status-msg");
    const productImg = document.getElementById("product-img");
    const barcodeInput = document.getElementById("barcode-input");
    const correctHint = document.getElementById("correct-hint");

    function carregarItem() {
      const item = pedido.itens[indice];
      codeline.textContent = item.codigo;
      descline.textContent = item.descricao;
      requested.textContent = item.solicitado;
      picked.textContent = separadoAtual;
      productImg.src = item.imagem;
      productImg.alt = item.descricao;

      confirmStatus.textContent = "AGUARDANDO LEITURA";
      confirmStatus.className = "value blink";
      statusMsg.textContent = "";
      statusMsg.className = "status-msg";
      correctHint.textContent = "Código correto: " + item.barcode;
      barcodeInput.value = "";
      barcodeInput.focus();
    }

    barcodeInput.addEventListener("keydown", (e) => {
      if (e.key === "Enter") {
        const item = pedido.itens[indice];
        if (barcodeInput.value.trim() === item.barcode) {
          separadoAtual++;
          picked.textContent = separadoAtual;
          statusMsg.textContent = "BIP CORRETO!";
          statusMsg.className = "status-msg status-ok";

          if (separadoAtual >= item.solicitado) {
            confirmStatus.textContent = "CONCLUÍDO";
            confirmStatus.className = "value";
            statusMsg.textContent = "ITEM FINALIZADO!";
          }
        } else {
          statusMsg.textContent = "CÓDIGO INVÁLIDO!";
          statusMsg.className = "status-msg status-err";
        }
        barcodeInput.value = "";
      }
    });

    document.getElementById("btn-prev").addEventListener("click", () => {
      if (indice > 0) {
        indice--;
        separadoAtual = 0;
        carregarItem();
      }
    });

    document.getElementById("btn-next").addEventListener("click", () => {
      if (indice < pedido.itens.length - 1) {
        indice++;
        separadoAtual = 0;
        carregarItem();
      }
    });

    setInterval(() => {
      const now = new Date();
      document.getElementById("clock").textContent = 
        String(now.getHours()).padStart(2, "0") + ":" + 
        String(now.getMinutes()).padStart(2, "0");
    }, 1000);

    carregarItem();
  </script>
</body>
</html>
